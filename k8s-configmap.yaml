apiVersion: v1
kind: ConfigMap
metadata:
  name: wolf-strategy-config
  labels:
    app.kubernetes.io/name: wolf
    app.kubernetes.io/component: strategy
data:
  WOLF_SHORT_LEVERAGE: "100"
  WOLF_SHORT_STOP_LOSS: "0.008"
  WOLF_SHORT_TAKE_PROFIT: "0.03"
  WOLF_DCA_MAX_COUNT: "5"
  WOLF_DCA_INCREMENT: "1.5"
  WOLF_PROFIT_FLIP_ENABLED: "true"
  WOLF_LOG_LEVEL: "INFO"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wolf-trader
  labels:
    app.kubernetes.io/name: wolf
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wolf-trader-binding
  labels:
    app.kubernetes.io/name: wolf
subjects:
- kind: ServiceAccount
  name: default
  namespace: default
roleRef:
  kind: Role
  name: wolf-trader
  apiGroup: rbac.authorization.k8s.io
